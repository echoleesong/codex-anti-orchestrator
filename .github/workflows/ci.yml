name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Format, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Diagnose preflight formatting
        run: |
          npx prettier --write src/adapters/deterministic-preflight.ts
          echo '---PRETTIER-DIFF---'
          git diff -- src/adapters/deterministic-preflight.ts
          echo '---END-PRETTIER-DIFF---'

      - name: Check code formatting
        run: npm run format:check

      - name: Static type checking
        run: npm run typecheck

      - name: Run automated test suite
        run: npm test

      - name: Build project
        run: npm run build
