name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    name: Format, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply dependency remediations
        run: |
          npm install --save-dev vitest@^4.1.11
          npm update qs

      - name: Require clean npm audit
        run: npm audit --audit-level=moderate

      - name: Check code formatting
        run: npm run format:check

      - name: Static type checking
        run: npm run typecheck

      - name: Run automated test suite
        run: npm test

      - name: Build project
        run: npm run build

      - name: Persist validated dependency updates
        if: ${{ success() }}
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'Dependency remediations are already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'chore: remediate dependency advisories'
          git push origin HEAD:${{ github.head_ref }}
